plugins {
  id 'com.android.library'
  id 'kotlin-android'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.agenui'
version = '0.1.0'

android {
  namespace "expo.modules.agenui"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation project(':expo-modules-core')
  compileOnly files("../../../android/app/libs/AGenUI-Client-Android-release.aar")

  compileOnly 'com.facebook.react:react-android'
  compileOnly 'com.facebook.react:hermes-android'
}
